name: Auto-bump plugin version

# Runs on every push to master EXCEPT version-bump commits (to avoid loops).
# Determines bump type from the commit message (conventional commits):
#   feat:           -> minor  (1.2.2 -> 1.3.0)
#   BREAKING CHANGE -> major  (1.2.2 -> 2.0.0)
#   anything else   -> patch  (1.2.2 -> 1.2.3)
#
# After bumping:
#   - Updates .claude-plugin/plugin.json version
#   - Syncs .claude-plugin/marketplace.json SHA to HEAD
#   - Commits with [skip ci] to avoid re-triggering
#   - Creates and pushes git tag: one-shot-prompting--vX.Y.Z
#     (the format claude plugin tag uses, which community catalog CI watches)

on:
  push:
    branches: [master]

jobs:
  bump-version:
    # Skip if this is a version-bump commit (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push commits + tags

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT or the default token with write permissions
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # full history so bump_version.py can read commit msg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bump version + sync marketplace SHA
        id: bump
        run: |
          NEW_VERSION=$(python scripts/bump_version.py)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to: $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          # [skip ci] prevents this commit from re-triggering the workflow
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"

      - name: Create and push release tag
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          TAG="one-shot-prompting--v$VERSION"
          # Force-update the tag if it already exists (e.g. re-run on same version)
          git tag -f -a "$TAG" -m "one-shot-prompting $VERSION"
          git push origin master
          git push origin "refs/tags/$TAG" --force
          echo "Tagged: $TAG"
