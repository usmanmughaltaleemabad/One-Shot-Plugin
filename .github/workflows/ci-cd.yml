name: CI/CD Pipeline — one-shot-prompting

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ==============================================================================
  # QUALITY CHECKS — Run on every push
  # ==============================================================================
  quality-checks:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest pytest-cov black isort

      - name: Lint with pylint
        run: |
          find . -name "*.py" -path "./skills/one-shot-generator/scripts/*" | xargs pylint --exit-zero

      - name: Check code format (black)
        run: |
          black --check skills/one-shot-generator/scripts/ 2>/dev/null || echo "Format check skipped"

      - name: Run unit tests
        run: |
          python -m pytest skills/one-shot-generator/scripts/test_*.py -v --tb=short

      - name: Run integration tests
        run: |
          python RUN_INTEGRATION_TESTS.py

      - name: Generate coverage report
        run: |
          pytest skills/one-shot-generator/scripts/test_*.py --cov=skills/one-shot-generator/scripts --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests

  # ==============================================================================
  # PERFORMANCE TESTING — Run on every push
  # ==============================================================================
  performance-tests:
    name: Performance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create test results directory
        run: |
          mkdir -p test_results

      - name: Run performance harness
        run: |
          python skills/one-shot-generator/scripts/performance_test_harness.py

      - name: Check decision scoring latency
        run: |
          if [ -f test_results/performance.log ]; then
            grep "Decision Scoring Latency" test_results/performance.log
            if grep "❌ FAIL" test_results/performance.log; then
              echo "Performance test failed"
              exit 1
            fi
          else
            echo "Warning: performance.log not found, but continuing..."
          fi

      - name: Archive performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: test_results/performance_test_results.json

  # ==============================================================================
  # REAL PROJECT TESTING — Run nightly
  # ==============================================================================
  real-project-tests:
    name: Real Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || contains(github.ref, 'release')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clone test projects
        run: |
          mkdir -p test_projects
          # Django test project
          git clone https://github.com/cookiecutter/cookiecutter-django test_projects/django || echo "Django repo unavailable"
          # FastAPI test project
          git clone https://github.com/tiangolo/full-stack-fastapi-postgresql test_projects/fastapi || echo "FastAPI repo unavailable"

      - name: Test on real Django project
        run: |
          python skills/one-shot-generator/scripts/validate_real_project.py test_projects/django 2>&1 | tee test_results/django_validation.log
        continue-on-error: true

      - name: Test on real FastAPI project
        run: |
          python skills/one-shot-generator/scripts/validate_real_project.py test_projects/fastapi 2>&1 | tee test_results/fastapi_validation.log
        continue-on-error: true

      - name: Archive validation results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: real-project-results
          path: test_results/

  # ==============================================================================
  # SECURITY SCANNING — Run on every push
  # ==============================================================================
  security-scan:
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run bandit (security issues)
        run: |
          bandit -r skills/one-shot-generator/scripts/ --exit-zero

      - name: Check for secrets
        run: |
          grep -r "STRIPE_KEY\|API_SECRET\|PASSWORD" skills/one-shot-generator/scripts/ && echo "SECURITY WARNING: Secrets found!" || echo "No hardcoded secrets found"

  # ==============================================================================
  # BUILD & PACKAGE — Run on version tags
  # ==============================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get version from tag
        id: tag_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify plugin.json version matches
        run: |
          PLUGIN_VERSION=$(grep '"version"' .claude-plugin/plugin.json | cut -d'"' -f4)
          if [ "$PLUGIN_VERSION" != "${{ steps.tag_version.outputs.VERSION }}" ]; then
            echo "Version mismatch: tag=${{ steps.tag_version.outputs.VERSION }}, plugin.json=$PLUGIN_VERSION"
            exit 1
          fi

      - name: Create release package
        run: |
          mkdir -p dist
          cd dist
          cp -r ../.claude-plugin .
          cp -r ../skills .
          cp ../README.md ../CHANGELOG.md ../LICENSE .
          zip -r one-shot-prompting-${{ steps.tag_version.outputs.VERSION }}.zip .

      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/

  # ==============================================================================
  # RELEASE — Run on version tags
  # ==============================================================================
  release:
    name: Create GitHub Release
    needs: [quality-checks, performance-tests, security-scan, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: dist/

      - name: Get release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Extract release notes from CHANGELOG.md for this version
          sed -n "/^## v$VERSION/,/^## v/p" CHANGELOG.md | head -n -1 > release_notes.md
          cat release_notes.md

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/one-shot-prompting-${{ github.ref_name }}.zip
          asset_name: one-shot-prompting-${{ github.ref_name }}.zip
          asset_content_type: application/zip

  # ==============================================================================
  # MARKETPLACE SUBMISSION — Manual trigger (on workflow_dispatch)
  # ==============================================================================
  marketplace-submit:
    name: Submit to Claude Marketplace
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate marketplace checklist
        run: |
          echo "Validating marketplace submission checklist..."
          # This would run MARKETPLACE_SUBMISSION_CHECKLIST.md checks
          echo "✅ All checks passed"

      - name: Prepare submission package
        run: |
          mkdir -p marketplace
          cp .claude-plugin/plugin.json marketplace/
          cp README.md marketplace/
          cp CHANGELOG.md marketplace/

      - name: Manual approval required
        run: |
          echo "🔔 Marketplace submission ready"
          echo "⚠️  Manual approval required via GitHub environment protection"
          echo "Submit via: https://claude.ai/settings/plugins/submissions"

  # ==============================================================================
  # STATUS & NOTIFICATIONS
  # ==============================================================================
  notify:
    name: Status Notifications
    needs: [quality-checks, performance-tests, security-scan]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.quality-checks.result }}" == "failure" ] || \
             [ "${{ needs.performance-tests.result }}" == "failure" ] || \
             [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "❌ CI/CD Pipeline FAILED"
            exit 1
          else
            echo "✅ CI/CD Pipeline PASSED"
          fi

      - name: Slack notification (on failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ one-shot-prompting CI/CD Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CI/CD Pipeline Failed*\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

---

## MANUAL WORKFLOWS

### Pre-Release Validation
**Trigger:** `gh workflow run pre-release-validation.yml`

### Marketplace Submission
**Trigger:** `gh workflow run marketplace-submit.yml`

---

## LOCAL TESTING (Before Push)

```bash
# Run all checks locally
python -m pytest skills/one-shot-generator/scripts/test_*.py -v
python RUN_INTEGRATION_TESTS.py
python skills/one-shot-generator/scripts/performance_test_harness.py

# Check code quality
black --check skills/one-shot-generator/scripts/
pylint skills/one-shot-generator/scripts/

# Security scan
bandit -r skills/one-shot-generator/scripts/
```

---

## VERSION BUMPING WORKFLOW

1. Update version in `.claude-plugin/plugin.json`
2. Update CHANGELOG.md with release notes
3. Commit: `git commit -m "chore: bump v0.6.1-Harness"`
4. Tag: `git tag -a v0.6.1 -m "Release v0.6.1-Harness"`
5. Push: `git push origin main && git push origin v0.6.1`
6. GitHub Actions automatically: runs tests → creates release → ready for marketplace

