name: Tests & Quality Gates

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Run smoke tests
      run: |
        bash .claude/scripts/smoke-test.sh

    - name: Run integration tests
      run: |
        python RUN_INTEGRATION_TESTS.py

    - name: Check CLAUDE.md size
      run: |
        lines=$(wc -l < CLAUDE.md)
        if [ "$lines" -gt 100 ]; then
          echo "ERROR: CLAUDE.md has $lines lines (limit: 100)"
          exit 1
        fi

    - name: Verify YAML frontmatter
      run: |
        # Check all .md files in docs/ have frontmatter
        for file in docs/*.md skills/*/CLAUDE.md commands/CLAUDE.md tests/CLAUDE.md; do
          if [ -f "$file" ]; then
            if ! head -5 "$file" | grep -q "^---"; then
              echo "ERROR: $file missing YAML frontmatter"
              exit 1
            fi
          fi
        done

    - name: Check version consistency
      run: |
        plugin_ver=$(grep -o '"version"\s*:\s*"[^"]*"' .claude-plugin/plugin.json 2>/dev/null | cut -d'"' -f4)
        changelog_ver=$(grep -E "^## v" CHANGELOG.md 2>/dev/null | head -1 | grep -o "v[0-9.]*" || echo "")
        if [ -n "$plugin_ver" ] && [ -n "$changelog_ver" ]; then
          if [ "$plugin_ver" != "${changelog_ver#v}" ]; then
            echo "ERROR: plugin.json ($plugin_ver) != CHANGELOG.md (${changelog_ver#v})"
            exit 1
          fi
        fi

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install pylint
      run: |
        python -m pip install --upgrade pip
        pip install pylint

    - name: Lint Python files
      run: |
        # Lint Phase 0-3 scripts only (Phase 4-5 may have stubs)
        for file in skills/*/scripts/*.py; do
          if ! echo "$file" | grep -qE "phase4_|phase5_"; then
            echo "Checking $file..."
            python -m py_compile "$file" || true
          fi
        done

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Bandit (security check)
      run: |
        python -m pip install --upgrade pip bandit
        # Check Phase 0-3 scripts for security issues (stubs may have placeholders)
        bandit -r skills/*/scripts/ -ll --skip B101,B601 || true

    - name: Check for hardcoded secrets
      run: |
        if grep -r "api_key\|password\|secret" --include="*.py" skills/ | grep -v "# placeholder" | grep -v "#"; then
          echo "WARNING: Possible hardcoded secrets found"
          exit 1
        fi
