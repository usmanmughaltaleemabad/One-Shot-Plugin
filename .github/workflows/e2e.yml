name: E2E Pipeline Test

on:
  workflow_dispatch:        # manual trigger from Actions tab
  schedule:
    - cron: '0 6 * * 1'    # every Monday 06:00 UTC
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Live job — runs the full pipeline against a real fixture using a real
  # API key. Costs real money (~$0.30 per run). Skipped on forks and on
  # the main repo until ANTHROPIC_API_KEY secret is configured.
  # See docs/CI_SETUP.md for how to enable.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-live:
    name: Live pipeline (requires ANTHROPIC_API_KEY)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest pytest-asyncio anthropic httpx fastapi sqlalchemy pydantic

      - name: Skip if no API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY — skipping live steps"
            echo "SKIP_LIVE=true" >> $GITHUB_ENV
          fi

      - name: Replay evals
        if: env.SKIP_LIVE != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/evals/agentic_evals.py --mode replay --json

      - name: Live architect eval — 1 scenario
        if: env.SKIP_LIVE != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/evals/agentic_evals.py \
              --mode live --scenario architect-signup-flow --json \
              > /tmp/live-result.json
          cat /tmp/live-result.json
        timeout-minutes: 5

      - name: Assert architect overall >= 0.85
        if: env.SKIP_LIVE != 'true'
        run: |
          python -c "
          import json, sys
          d = json.load(open('/tmp/live-result.json'))
          if isinstance(d, list): d = d[0]
          assert d['overall'] >= 0.85, f'scored {d[\"overall\"]} (< 0.85)'
          print(f'OK: {d[\"overall\"]}')
          "

      - name: Upload live result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-result
          path: /tmp/live-result.json
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Free job — runs without an API key. Validates replay evals, harness
  # wiring, and skill integration. Runs on every push.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-dry:
    name: Dry-run (no API key — free, runs always)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio anthropic httpx \
                      fastapi sqlalchemy pydantic

      - name: Canary — live_api_runner refuses gracefully without API key
        env:
          ANTHROPIC_API_KEY: ''
          PYTHONIOENCODING: utf-8
        run: |
          python skills/one-shot-generator/scripts/live_api_runner.py \
              --agent architect \
              --input-json '{"task":"add user auth"}' || true
          # Expected: graceful skip/error with missing_anthropic_api_key — exit code ignored

      - name: Replay evals — all 14 scenarios across 7 agent types
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/evals/agentic_evals.py --mode replay --json > /tmp/replay.json
          python -c "
          import json
          results = json.load(open('/tmp/replay.json'))
          passed = sum(1 for r in results if r['passed'])
          print(f'{passed}/{len(results)} replays passed')
          assert passed == len(results), f'{len(results) - passed} replays failed'
          # By agent: must have ≥1 replay per supported agent type
          by_agent = {}
          for r in results:
              by_agent[r['agent']] = by_agent.get(r['agent'], 0) + 1
          expected = {'architect', 'implementer', 'test-author',
                      'reviewer', 'doubter', 'critic', 'handoff'}
          missing = expected - set(by_agent)
          assert not missing, f'no replays for agents: {missing}'
          print('Agents covered:', sorted(by_agent))
          "

      - name: Skill-wiring tests (mattpocock integration is real)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/test_mattpocock_skill_wiring.py -v

      - name: Curriculum seed validation
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/test_curriculum_seed.py -v

      - name: Compliance audit (self-audit, not Anthropic-reviewed)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python skills/one-shot-generator/scripts/compliance_audit.py
          # Expected: 15/15 PASS, 0 WARN, 0 FAIL
